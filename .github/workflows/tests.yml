name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    # Pure-Python tests: every module imports and compiles, and the corrected geometry,
    # statistics, SDC and launcher logic behave as expected on synthetic data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      # the environment users get: exact versions of requirements-lock.txt (CPU build of torch)
      - run: bash Tools/setup_venv.sh --cpu --dev --venv "$RUNNER_TEMP/venvEDNiX" --python python
      - run: '"$RUNNER_TEMP/venvEDNiX/bin/python" -m pytest -n auto -p no:cacheprovider'
