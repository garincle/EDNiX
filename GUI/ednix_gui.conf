# Optional settings of the EDNiX interface launchers. One setting per line, KEY=value,
# without # in front to activate it. Everything is detected automatically when these lines
# stay commented:
#   - the EDNiX folder is the folder that contains GUI/
#   - the atlas library is <EDNiX folder>/Atlases_library
#   - Python is searched in ~/PycharmProjects, <EDNiX folder>/venv* and conda environments
#
# EDNIX_PYTHON=/path/to/your/environment/bin/python
# EDNIX_REPO=/path/to/EDNiX
# EDNIX_ATLAS_LIBRARY=/path/to/EDNiX/Atlases_library
#
# Interface running on a remote server, opened from this computer (GUI/open_remote.sh):
# EDNIX_REMOTE_HOST=gpu-07-01
# EDNIX_REMOTE_REPO=/home/cgarin/PycharmProjects/EDNiX
